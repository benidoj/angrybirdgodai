<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Great Sage Overlay</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ---- Avatar (mirrors styles.css) ---- */
    .great-sage-avatar {
      position: fixed;
      right: 16px;
      bottom: 14px;
      width: 150px;
      height: 190px;
      cursor: pointer;
      pointer-events: auto;
      z-index: 55;
      opacity: 1;
      transform: translateY(0) scale(1);
      visibility: visible;
      transition: opacity 0.45s ease, transform 0.45s ease, visibility 0s;
      filter: drop-shadow(0 0 16px rgba(120, 220, 195, 0.42));
    }

    .great-sage-avatar.great-sage-off {
      opacity: 0;
      transform: translateY(26px) scale(0.7);
      pointer-events: none;
      visibility: hidden;
      transition: opacity 0.45s ease, transform 0.45s ease, visibility 0s linear 0.45s;
    }

    .great-sage-figure {
      width: 100%;
      height: 100%;
      transform: perspective(480px) rotateX(24deg);
      transform-style: preserve-3d;
      will-change: transform;
      animation: sage-float-3d 4.2s ease-in-out infinite, sage-hologram 7s ease-in-out infinite;
    }

    @keyframes sage-float-3d {
      0%,
      100% {
        transform: perspective(480px) rotateX(24deg) translateY(0);
      }

      50% {
        transform: perspective(480px) rotateX(24deg) translateY(-8px);
      }
    }

    .sage-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      will-change: transform;
    }

    .sage-layer-deep {
      transform: translateZ(-46px);
      opacity: 0.85;
    }

    .sage-layer-mid {
      transform: translateZ(-16px);
    }

    .sage-layer-outer {
      transform: translateZ(8px);
    }

    .sage-layer-inner {
      transform: translateZ(30px);
    }

    .sage-layer-core {
      transform: translateZ(56px);
    }

    .sage-hex-outer,
    .sage-hex-inner,
    .sage-swoosh {
      transform-box: view-box;
      transform-origin: 50% 50%;
    }

    .sage-hex-outer {
      animation: sage-spin-cw 30s linear infinite;
    }

    .sage-hex-inner {
      animation: sage-spin-ccw 20s linear infinite;
    }

    .great-sage-avatar.thinking .sage-hex-inner {
      animation-duration: 6s;
    }

    .great-sage-avatar.speaking .sage-hex-inner {
      animation-duration: 10s;
    }

    .sage-swoosh {
      animation: sage-spin-cw 44s linear infinite;
    }

    @keyframes sage-spin-cw {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes sage-spin-ccw {
      to {
        transform: rotate(-360deg);
      }
    }

    @keyframes sage-hologram {
      0%,
      100% {
        opacity: 1;
      }

      46% {
        opacity: 0.97;
      }

      48% {
        opacity: 0.88;
      }

      50% {
        opacity: 0.98;
      }

      72% {
        opacity: 0.93;
      }
    }

    .sage-mote {
      animation: sage-mote 5.5s ease-in-out infinite;
    }

    @keyframes sage-mote {
      0%,
      100% {
        opacity: 0.12;
      }

      50% {
        opacity: 0.9;
      }
    }

    .great-sage-bubble {
      position: absolute;
      right: 4px;
      bottom: calc(100% + 4px);
      max-width: 252px;
      padding: 9px 12px;
      background: rgba(32, 26, 18, 0.94);
      border: 1px solid rgba(140, 230, 205, 0.45);
      border-radius: 12px 12px 4px 12px;
      color: #d9f5ec;
      font-size: 12.5px;
      line-height: 1.45;
      text-align: left;
      white-space: normal;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      opacity: 0;
      transform: translateY(8px) scale(0.96);
      transition: opacity 0.3s ease, transform 0.3s ease;
      pointer-events: none;
    }

    .great-sage-bubble.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .great-sage-swirl {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 132px;
      height: 132px;
      margin: -70px 0 0 -66px;
      border-radius: 50%;
      background: conic-gradient(
        from 0deg,
        rgba(140, 230, 205, 0) 0deg,
        rgba(140, 230, 205, 0.4) 70deg,
        rgba(220, 255, 245, 0.6) 110deg,
        rgba(140, 230, 205, 0) 185deg,
        rgba(140, 230, 205, 0) 360deg
      );
      -webkit-mask: radial-gradient(circle, transparent 32%, #000 44%, #000 62%, transparent 72%);
      mask: radial-gradient(circle, transparent 32%, #000 44%, #000 62%, transparent 72%);
      opacity: 0;
      transition: opacity 0.5s ease;
      pointer-events: none;
    }

    .great-sage-avatar.thinking .great-sage-swirl {
      opacity: 1;
      animation: sage-swirl 3.2s linear infinite;
    }

    .great-sage-avatar.thinking .sage-aura {
      animation: sage-glow 3.2s ease-in-out infinite;
    }

    @keyframes sage-swirl {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    .great-sage-rings {
      position: absolute;
      left: 50%;
      bottom: 16px;
      width: 96px;
      height: 96px;
      transform: translateX(-50%);
    }

    .great-sage-rings span {
      position: absolute;
      inset: 0;
      border: 2px solid rgba(160, 235, 210, 0.7);
      border-radius: 50%;
      opacity: 0;
    }

    .great-sage-avatar.speaking .great-sage-rings span {
      animation: sage-ring 1.8s ease-out infinite;
    }

    .great-sage-avatar.speaking .great-sage-rings span:nth-child(2) {
      animation-delay: 0.6s;
    }

    .great-sage-avatar.speaking .great-sage-rings span:nth-child(3) {
      animation-delay: 1.2s;
    }

    @keyframes sage-ring {
      0% {
        transform: scale(0.35);
        opacity: 0.8;
      }

      100% {
        transform: scale(1.15);
        opacity: 0;
      }
    }

    .sage-mouth {
      transform-box: fill-box;
      transform-origin: center;
    }

    .great-sage-avatar.speaking .sage-mouth {
      animation: sage-talk 0.3s ease-in-out infinite alternate;
    }

    @keyframes sage-talk {
      from {
        transform: scaleY(0.5);
      }

      to {
        transform: scaleY(2.6);
      }
    }

    .great-sage-avatar.speaking .sage-aura {
      animation: sage-glow 1.4s ease-in-out infinite;
    }

    @keyframes sage-glow {
      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.6;
      }
    }

    .great-sage-avatar.speaking .sage-eyes circle {
      animation: sage-eyes 0.9s ease-in-out infinite alternate;
    }

    @keyframes sage-eyes {
      from {
        opacity: 1;
      }

      to {
        opacity: 0.55;
      }
    }
  </style>
</head>
<body>
  <div class="great-sage-avatar great-sage-off" id="greatSageAvatar" role="button" aria-label="Great Sage — click to stop reading aloud">
    <div class="great-sage-bubble" id="greatSageBubble" aria-hidden="true"></div>
    <div class="great-sage-swirl" aria-hidden="true"></div>
    <div class="great-sage-rings"><span></span><span></span><span></span></div>
    <div class="great-sage-figure" aria-hidden="true">
      <svg class="sage-layer sage-layer-deep" viewBox="0 0 120 170" fill="none">
        <g class="sage-panels" fill="#cfe8e0">
          <rect x="14" y="58" width="12" height="7" opacity="0.16" />
          <rect x="90" y="40" width="11" height="6" opacity="0.2" />
          <rect x="86" y="118" width="12" height="7" opacity="0.15" />
          <rect x="18" y="112" width="10" height="6" opacity="0.18" />
          <rect x="48" y="10" width="14" height="6" opacity="0.14" />
          <rect x="64" y="150" width="12" height="6" opacity="0.16" />
        </g>
        <circle class="sage-mote" cx="26" cy="58" r="1.4" fill="#a8ecd8" />
        <circle class="sage-mote" cx="95" cy="78" r="1.2" fill="#a8ecd8" style="animation-delay: 1.1s" />
        <circle class="sage-mote" cx="32" cy="104" r="1" fill="#a8ecd8" style="animation-delay: 2.2s" />
        <circle class="sage-mote" cx="90" cy="38" r="1" fill="#a8ecd8" style="animation-delay: 3s" />
      </svg>
      <svg class="sage-layer sage-layer-mid" viewBox="0 0 120 170" fill="none">
        <g class="sage-spokes" stroke="#eafff5" stroke-width="0.8" opacity="0.65">
          <path d="M60 61 L60 4" />
          <path d="M84 85 L120 85" />
          <path d="M36 85 L2 85" />
          <path d="M60 109 L60 166" />
          <path d="M80.8 73 L126 46" />
          <path d="M39.2 73 L14 30" />
          <path d="M80.8 97 L120 122" />
          <path d="M39.2 97 L6 118" />
          <path d="M72 64 L98 22" />
          <path d="M48 64 L30 12" />
          <path d="M72 106 L92 144" />
          <path d="M48 106 L34 148" />
        </g>
        <g class="sage-swoosh" fill="none" stroke="#ffffff">
          <path d="M16 44 A50 50 0 0 1 92 26" stroke-width="5" opacity="0.3" />
          <path d="M104 128 A50 50 0 0 1 30 142" stroke-width="4" opacity="0.25" />
        </g>
      </svg>
      <svg class="sage-layer sage-layer-outer" viewBox="0 0 120 170" fill="none">
        <polygon class="sage-hex-outer" points="60,23 114,54 114,116 60,147 6,116 6,54" stroke="#eafff5" stroke-width="1.2" opacity="0.85" />
        <polygon class="sage-hex-inner" points="92,85 76,112.7 44,112.7 28,85 44,57.3 76,57.3" stroke="#eafff5" stroke-width="0.9" opacity="0.8" />
        <g class="sage-eyes">
          <circle cx="6" cy="54" r="2.4" fill="#ffffff" />
          <circle cx="114" cy="54" r="2.4" fill="#ffffff" />
        </g>
        <g fill="#ffffff" opacity="0.9">
          <circle cx="60" cy="23" r="2" />
          <circle cx="114" cy="116" r="2" />
          <circle cx="60" cy="147" r="2" />
          <circle cx="6" cy="116" r="2" />
          <circle cx="87" cy="38.5" r="1.4" />
          <circle cx="114" cy="85" r="1.4" />
          <circle cx="87" cy="131.5" r="1.4" />
          <circle cx="33" cy="131.5" r="1.4" />
          <circle cx="6" cy="85" r="1.4" />
          <circle cx="33" cy="38.5" r="1.4" />
        </g>
      </svg>
      <svg class="sage-layer sage-layer-inner" viewBox="0 0 120 170" fill="none">
        <g class="sage-cells" fill="#eafff5" opacity="0.85">
          <rect x="94" y="70" width="3" height="3" />
          <rect x="40" y="62" width="3" height="3" />
          <rect x="76" y="124" width="3" height="3" />
          <rect x="30" y="100" width="3" height="3" />
          <rect x="53" y="30" width="3" height="3" />
          <rect x="64" y="128" width="3" height="3" />
        </g>
      </svg>
      <svg class="sage-layer sage-layer-core" viewBox="0 0 120 170" fill="none">
        <defs>
          <radialGradient id="sageAura" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#f4fffb" stop-opacity="1" />
            <stop offset="18%" stop-color="#bdf0e0" stop-opacity="0.55" />
            <stop offset="45%" stop-color="#3f7a6d" stop-opacity="0.3" />
            <stop offset="100%" stop-color="#1c3f38" stop-opacity="0" />
          </radialGradient>
        </defs>
        <circle class="sage-aura" cx="60" cy="85" r="55" fill="url(#sageAura)" />
        <circle cx="60" cy="85" r="20" fill="#ffffff" opacity="0.22" />
        <circle cx="60" cy="85" r="11" fill="#ffffff" opacity="0.95" />
        <ellipse class="sage-mouth" cx="60" cy="103" rx="12" ry="2.4" stroke="#eafff5" stroke-width="1.3" opacity="0.75" />
      </svg>
    </div>
  </div>

  <script>
    const avatar = document.getElementById('greatSageAvatar');
    const bubble = document.getElementById('greatSageBubble');

    // Drag & drop: grab the sigil to move the whole overlay window. A small
    // movement counts as a drag; a click without movement stops the speech.
    let drag = null;
    avatar.addEventListener('pointerdown', (event) => {
      if (event.button !== 0) return;
      drag = { x: event.clientX, y: event.clientY, moved: false };
      avatar.setPointerCapture(event.pointerId);
      if (window.overlay) window.overlay.dragStart();
    });
    avatar.addEventListener('pointermove', (event) => {
      if (!drag) return;
      const dx = event.clientX - drag.x;
      const dy = event.clientY - drag.y;
      if (Math.abs(dx) + Math.abs(dy) > 4) drag.moved = true;
      if (drag.moved && window.overlay) window.overlay.drag(dx, dy);
    });
    const endDrag = () => {
      if (drag && !drag.moved && window.overlay) window.overlay.stop();
      drag = null;
    };
    avatar.addEventListener('pointerup', endDrag);
    avatar.addEventListener('pointercancel', () => { drag = null; });

    window.overlay.onState((state) => {
      const visible = Boolean(state && state.visible);
      avatar.classList.toggle('great-sage-off', !visible);
      avatar.classList.toggle('thinking', visible && state.mode === 'thinking');
      avatar.classList.toggle('speaking', visible && state.mode === 'speaking');
      if (visible && state.bubble) {
        bubble.textContent = state.bubble;
        bubble.classList.add('visible');
      } else {
        bubble.classList.remove('visible');
        bubble.textContent = '';
      }
    });
  </script>
</body>
</html>
